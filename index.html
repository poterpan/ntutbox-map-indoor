<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f9" />
  <title>@ntutbox/map 開發頁</title>
  <link rel="stylesheet" href="/dev/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">NTUT CAMPUS · THREE.JS DEMO</div>
        <h1>空教室</h1>
      </div>
      <button id="resetView" class="round-button" aria-label="重設視角">↗</button>
    </header>

    <section class="filters">
      <div class="filter-wrap">
        <button class="filter-card" id="timeFilter" aria-haspopup="menu">
          <span class="filter-label">時間</span>
          <span class="filter-value"><span id="timeValue">載入課表…</span> ⌄</span>
        </button>
        <div id="timeMenu" class="building-menu time-menu hidden" role="menu"></div>
      </div>
      <div class="filter-wrap">
        <button class="filter-card" id="buildingFilter" aria-haspopup="menu">
          <span class="filter-label">大樓</span>
          <span class="filter-value"><span id="buildingName">第三教學大樓</span> ⌄</span>
        </button>
        <div id="buildingMenu" class="building-menu hidden" role="menu"></div>
      </div>
    </section>

    <main class="stage">
      <div id="scene"></div>

      <div class="view-switch">
        <button data-view="building" class="active">大樓</button>
        <button data-view="campus">校園白模</button>
      </div>

      <div class="floor-title">
        <span id="floorTitle"></span>
        <small id="floorSummary"></small>
      </div>

      <button id="campusCard" class="campus-card hidden" aria-label="進入這棟大樓">
        <span class="cc-text"><b></b><small></small></span>
        <span class="cc-go"><span class="cc-hint"></span> →</span>
      </button>

      <div class="legend">
        <span><i class="dot free"></i>這節沒排課</span>
        <span><i class="dot soon"></i>60 分鐘內有課</span>
        <span><i class="dot busy"></i>這節有課</span>
        <span><i class="dot unknown"></i>無課表資料</span>
      </div>

      <div class="tip" id="tip"></div>

      <section id="roomSheet" class="room-sheet hidden">
        <button id="closeSheet" class="sheet-close" aria-label="關閉">×</button>
        <div class="sheet-kicker" id="sheetFloor"></div>
        <div class="sheet-title-row">
          <h2 id="sheetRoom"></h2>
          <span id="sheetBadge" class="status-badge"></span>
        </div>
        <div class="sheet-meta">
          <div><span class="meta-label" id="sheetSlot">依課表</span><strong id="sheetStatus">—</strong></div>
          <div><span class="meta-label">容量</span><strong id="sheetCapacity">—</strong></div>
        </div>
        <a id="timetableLink" class="primary-button" target="_blank" rel="noopener">整週課表 →</a>
        <p class="route-note">依排課系統的課表推算；沒排課不代表一定沒人使用。</p>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>

    <footer class="demo-footer">
      <span id="footerBuilding">真實 GIS 幾何</span>
      <span><span id="dataSource"></span> · @ntutbox/map 0.9</span>
    </footer>
  </div>

  <script type="module" src="/dev/main.js"></script>
</body>
</html>
