name: publish

# Pushing a tag vX.Y.Z stages that version on npm through Trusted Publishing (OIDC): no npm token is stored
# anywhere, and provenance links the package to this workflow run. The trusted publisher may only *stage*;
# the version goes public when a maintainer approves it on npmjs.com (Staged Packages) with 2FA.
# A compromised repo or CI can therefore not ship a release by itself. Details: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.15.0 # npm stage needs >= 11.15.0
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "$version" ]]; then echo "::error::tag $TAG != package.json $version"; exit 1; fi
      # A version published by hand (a new package's first release, docs/RELEASING.md) gets its tag
      # afterwards for the record; there is nothing left to stage then.
      - name: Skip versions already on npm
        id: existing
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Stage on npm (approve on npmjs.com → Staged Packages)
        if: steps.existing.outputs.skip != 'true'
        run: npm stage publish --provenance
