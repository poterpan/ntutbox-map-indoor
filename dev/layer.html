<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndoorLayer host harness</title>
  <style>
    html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; background: #dfe7ef; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    /* The overlay container reuses the package label styles (scoped to .indoor-map) and lets clicks through. */
    #labels { position: absolute; inset: 0; pointer-events: none; }
    #bar { position: fixed; left: 12px; top: 12px; z-index: 10; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #bar button { border: 0; border-radius: 9px; padding: 7px 12px; background: rgba(255,255,255,.9); font-weight: 650; cursor: pointer; }
    #bar button.active { background: #0a84ff; color: #fff; }
    #info { position: fixed; left: 12px; bottom: 12px; z-index: 10; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.9); max-width: 70vw; }
  </style>
</head>
<body>
  <div id="stage"><div id="labels" class="indoor-map"></div></div>
  <div id="bar">
    <button data-mode="inplace">inplace</button>
    <button data-mode="stack">stack</button>
    <button data-mode="floor">floor</button>
    <select id="floor"></select>
  </div>
  <div id="info">載入中…</div>
  <script type="module" src="./layer.js"></script>
</body>
</html>
